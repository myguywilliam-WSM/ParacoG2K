<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — Paraco Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #5BA4CF;
    --primary: #1B3A6B;
    --primary-dark: #122850;
    --accent: #5BA4CF;
    --dark: #0c1724;
    --dark2: #111f30;
    --dark3: #182a3e;
    --border: #1d3352;
    --text: #eef2f7;
    --muted: #6b90b0;
    --green: #22c55e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 860px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    color: var(--primary);
    letter-spacing: 2px;
  }
  .badge {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .nav-links {
    margin-left: auto;
    display: flex;
    gap: 0.75rem;
  }
  .nav-link {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .nav-link:hover { color: var(--text); border-color: #555; }

  h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .section { margin-bottom: 2.5rem; }

  /* Categories grid */
  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.75rem;
  }
  .cat-card {
    background: var(--dark2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .cat-card:hover { border-color: var(--primary); }
  .cat-card.selected {
    border-color: var(--primary);
    background: rgba(255,75,31,0.1);
  }
  .cat-card .emoji { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .cat-card .name { font-weight: 600; font-size: 0.9rem; }
  .cat-card .count { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
  .check {
    float: right;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    transition: all 0.2s;
  }
  .cat-card.selected .check {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .select-all-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .btn-sm {
    padding: 0.4rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark3);
    color: var(--text);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-sm:hover { border-color: var(--primary); color: var(--primary); }

  /* Settings */
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .setting-block {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }
  .setting-block label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
  }
  .setting-block select,
  .setting-block input[type="number"] {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
  }
  .setting-block select:focus,
  .setting-block input:focus { border-color: var(--primary); }

  /* Summary */
  .summary-bar {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .summary-item { }
  .summary-item .val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--primary);
    line-height: 1;
  }
  .summary-item .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .btn-launch {
    display: block;
    width: 100%;
    padding: 1rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-launch:hover { background: var(--primary-dark); }
  .btn-launch:disabled { background: #444; color: #888; cursor: not-allowed; }

  .status-msg { font-size: 0.85rem; color: var(--muted); margin-top: 0.75rem; text-align: center; }
  .status-msg.ok { color: var(--green); }

  /* Players */
  .player-list { display: flex; flex-wrap: wrap; gap: 0.5rem; min-height: 2.5rem; }
  .player-pill {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    font-size: 0.85rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .player-pill .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
  .player-pill .rm {
    cursor: pointer; color: var(--muted); font-size: 0.7rem;
    background: none; border: none; color: #888; line-height: 1;
  }
  .player-pill .rm:hover { color: var(--primary); }
  .no-players { color: var(--muted); font-size: 0.85rem; padding: 0.5rem 0; font-style: italic; }

  @media (max-width: 600px) {
    .settings-grid { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <img src="Paraco_Logo.png" alt="Paraco" style="height:42px;width:auto;filter:brightness(0) invert(1)">
    <div class="badge">Setup</div>
    <nav class="nav-links">
      <a href="host.html" class="nav-link">Host View</a>
      <a href="stage.html" class="nav-link">Stage</a>
      <a href="join.html" class="nav-link">Join Link</a>
    </nav>
  </header>

  <!-- Categories -->
  <div class="section">
    <h2>Select Categories</h2>
    <div class="select-all-row">
      <button class="btn-sm" onclick="selectAll()">Select All</button>
      <button class="btn-sm" onclick="selectNone()">Clear All</button>
    </div>
    <div class="categories-grid" id="catGrid"></div>
  </div>

  <!-- Settings -->
  <div class="section">
    <h2>Game Settings</h2>
    <div class="settings-grid">
      <div class="setting-block">
        <label>Time Per Question</label>
        <select id="timeLimit">
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
          <option value="20" selected>20 seconds</option>
          <option value="30">30 seconds</option>
          <option value="45">45 seconds</option>
          <option value="60">60 seconds</option>
        </select>
      </div>
      <div class="setting-block">
        <label>Question Order</label>
        <select id="questionOrder">
          <option value="random">Randomize</option>
          <option value="sequential">Sequential (by category)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Players waiting -->
  <div class="section">
    <h2>Players in Lobby</h2>
    <div class="player-list" id="playerList">
      <span class="no-players">No players yet — share the Join page</span>
    </div>
  </div>

  <!-- Summary + Launch -->
  <div class="section">
    <div class="summary-bar">
      <div class="summary-item">
        <div class="val" id="sumCats">0</div>
        <div class="lbl">Categories</div>
      </div>
      <div class="summary-item">
        <div class="val" id="sumQs">0</div>
        <div class="lbl">Questions</div>
      </div>
      <div class="summary-item">
        <div class="val" id="sumPlayers">0</div>
        <div class="lbl">Players</div>
      </div>
      <div class="summary-item">
        <div class="val" id="sumTime">—</div>
        <div class="lbl">Est. Time</div>
      </div>
    </div>
    <button class="btn-launch" id="launchBtn" onclick="launchGame()">Launch Game</button>
    <p class="status-msg" id="statusMsg">Select at least one category to begin.</p>
  </div>
</div>

<script src="questions.js"></script>
<script src="state.js"></script>
<script>
  GameState.init();

  let selected = new Set();

  // Build category grid
  function buildGrid() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = '';
    TRIVIA_DATA.categories.forEach(cat => {
      const card = document.createElement('div');
      card.className = 'cat-card' + (selected.has(cat.id) ? ' selected' : '');
      card.dataset.id = cat.id;
      card.innerHTML = `
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div class="emoji">${cat.emoji}</div>
          <div class="check">${selected.has(cat.id) ? '✓' : ''}</div>
        </div>
        <div class="name">${cat.name}</div>
        <div class="count">${cat.questions.length} questions</div>
      `;
      card.onclick = () => toggleCat(cat.id);
      grid.appendChild(card);
    });
    updateSummary();
  }

  function toggleCat(id) {
    selected.has(id) ? selected.delete(id) : selected.add(id);
    buildGrid();
  }
  function selectAll() { TRIVIA_DATA.categories.forEach(c => selected.add(c.id)); buildGrid(); }
  function selectNone() { selected.clear(); buildGrid(); }

  function updateSummary() {
    const cats = [...selected];
    let qCount = 0;
    cats.forEach(id => {
      const cat = TRIVIA_DATA.categories.find(c => c.id === id);
      if (cat) qCount += cat.questions.length;
    });
    const timeLimit = parseInt(document.getElementById('timeLimit').value);
    const estMin = Math.ceil((qCount * (timeLimit + 5)) / 60);

    document.getElementById('sumCats').textContent = cats.length;
    document.getElementById('sumQs').textContent = qCount;
    document.getElementById('sumTime').textContent = qCount ? estMin + 'm' : '—';

    const btn = document.getElementById('launchBtn');
    const msg = document.getElementById('statusMsg');
    if (cats.length === 0) {
      btn.disabled = true;
      msg.textContent = 'Select at least one category to begin.';
      msg.className = 'status-msg';
    } else {
      btn.disabled = false;
      msg.textContent = `Ready: ${qCount} questions across ${cats.length} categor${cats.length === 1 ? 'y' : 'ies'}.`;
      msg.className = 'status-msg ok';
    }
  }

  function buildQueue() {
    const order = document.getElementById('questionOrder').value;
    let queue = [];
    [...selected].forEach(catId => {
      const cat = TRIVIA_DATA.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.questions.forEach(q => queue.push({ categoryId: catId, questionId: q.id }));
    });
    if (order === 'random') {
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
    }
    return queue;
  }

  function launchGame() {
    const timeLimit = parseInt(document.getElementById('timeLimit').value);
    const queue = buildQueue();
    const state = GameState.get();
    GameState.set({
      phase: 'lobby',
      selectedCategories: [...selected],
      questionQueue: queue,
      currentIndex: -1,
      currentQuestion: null,
      answers: {},
      timeLimit,
      timerStart: null,
      showAnswer: false
    });
    document.getElementById('statusMsg').textContent = 'Game configured! Go to Host View to start.';
    document.getElementById('statusMsg').className = 'status-msg ok';
  }

  function renderPlayers() {
    const state = GameState.get();
    const players = Object.keys(state.players || {});
    document.getElementById('sumPlayers').textContent = players.length;
    const list = document.getElementById('playerList');
    if (players.length === 0) {
      list.innerHTML = '<span class="no-players">No players yet — share the Join page</span>';
      return;
    }
    list.innerHTML = players.map(name => `
      <div class="player-pill">
        <span class="dot"></span>
        <span>${name}</span>
        <button class="rm" onclick="removePlayer('${name}')">✕</button>
      </div>
    `).join('');
  }

  function removePlayer(name) {
    const state = GameState.get();
    const players = { ...state.players };
    delete players[name];
    GameState.set({ players });
    renderPlayers();
  }

  GameState.onChange(renderPlayers);
  buildGrid();
  renderPlayers();

  document.getElementById('timeLimit').onchange = updateSummary;
</script>
</body>
</html>
