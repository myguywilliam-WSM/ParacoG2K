<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage — Paraco Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #5BA4CF;
    --primary: #1B3A6B;
    --primary-dark: #122850;
    --accent: #5BA4CF;
    --dark: #0a0a0a;
    --dark2: #141414;
    --dark3: #1e1e1e;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #777;
    --green: #22c55e;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Ambient background */
  .bg-glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,75,31,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,75,31,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,75,31,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Header bar */
  .header-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(10px);
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--primary); letter-spacing: 3px; }
  .q-progress { display: flex; align-items: center; gap: 1rem; }
  .progress-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .progress-bar-wrap { width: 200px; height: 4px; background: var(--dark3); border-radius: 999px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.5s ease; }
  .q-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--accent); }

  /* Main stages */
  .stage { display: none; width: 100%; max-width: 1100px; padding: 5rem 2rem 2rem; }
  .stage.active { display: flex; flex-direction: column; align-items: center; }

  /* Lobby stage */
  #stageLobby { text-align: center; }
  .lobby-flame { font-size: 5rem; animation: float 3s ease-in-out infinite; display: block; margin-bottom: 1.5rem; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .lobby-title { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: var(--text); letter-spacing: 6px; line-height: 1; }
  .lobby-sub { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--primary); letter-spacing: 4px; margin-bottom: 2rem; }
  .lobby-instruction {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 2.5rem;
    display: inline-flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .lobby-instruction .step { text-align: center; }
  .lobby-instruction .step-num { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--primary); }
  .lobby-instruction .step-text { font-size: 0.8rem; color: var(--muted); }
  .lobby-instruction .divider { width: 1px; height: 50px; background: var(--border); }
  .player-bubbles { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; min-height: 3rem; }
  .player-bubble {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 1.25rem;
    font-size: 1rem;
    display: flex; align-items: center; gap: 0.5rem;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .player-bubble .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
  .waiting-line { color: var(--muted); font-size: 1rem; margin-top: 1.5rem; }

  /* Question stage */
  #stageQuestion { }
  .cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    letter-spacing: 0.5px;
  }
  .question-text {
    font-size: 2.6rem;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 2.5rem;
    max-width: 900px;
  }
  .choices-stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 100%;
    max-width: 900px;
  }
  .choice-stage {
    background: var(--dark2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: all 0.4s;
    font-size: 1.1rem;
  }
  .choice-stage.correct {
    border-color: var(--green);
    background: rgba(34,197,94,0.15);
    transform: scale(1.02);
  }
  .choice-stage.dimmed {
    opacity: 0.35;
  }
  .choice-key {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--dark3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 1px;
    color: var(--primary);
    flex-shrink: 0;
  }
  .choice-stage.correct .choice-key { background: var(--green); color: #000; }

  /* Timer arc */
  .timer-container {
    position: fixed;
    top: 50%; right: 2.5rem;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 5;
  }
  .timer-svg { transform: rotate(-90deg); }
  .timer-svg .bg-c { fill: none; stroke: var(--dark3); stroke-width: 6; }
  .timer-svg .fg-c { fill: none; stroke: var(--primary); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .timer-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    pointer-events: none;
  }
  .timer-wrap-pos { position: relative; width: 90px; height: 90px; }

  /* Answer count */
  .answer-count-bar {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.65rem 1.75rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.9rem;
    z-index: 10;
  }
  .ans-count-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent); }
  .ans-dots { display: flex; gap: 0.4rem; flex-wrap: wrap; max-width: 400px; }
  .ans-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dark3); border: 1px solid var(--border); transition: all 0.3s; }
  .ans-dot.in { background: var(--green); border-color: var(--green); }

  /* Scores stage */
  #stageScores { }
  .scores-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--accent); letter-spacing: 3px; margin-bottom: 2rem; text-align: center; }
  .scores-list { width: 100%; max-width: 700px; }
  .score-row-stage {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 1rem 1.5rem;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    animation: slideIn 0.4s ease both;
  }
  @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .rank-num { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--muted); width: 2.5rem; }
  .rank-num.gold-rank { color: var(--accent); }
  .rank-name { flex: 1; font-size: 1.3rem; font-weight: 500; }
  .rank-pts { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--primary); }

  /* Reveal stage */
  #stageReveal { text-align: center; }
  .reveal-correct-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--green); margin-bottom: 0.75rem; }
  .reveal-answer {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 2rem;
    max-width: 800px;
    text-align: center;
    animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .scorers-wrap { }
  .scorers-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 0.75rem; }
  .scorers-list { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .scorer-pill {
    background: rgba(34,197,94,0.15);
    border: 1px solid var(--green);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.9rem;
    color: var(--green);
  }

  /* End stage */
  #stageEnd { text-align: center; }
  .end-trophy { font-size: 5rem; margin-bottom: 1rem; animation: float 2s ease-in-out infinite; }
  .end-title { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 2rem; }
  .final-scores { width: 100%; max-width: 600px; }
  .final-row {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .final-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--muted); width: 2rem; }
  .final-rank.top { color: var(--accent); }
  .final-name { flex: 1; font-size: 1.1rem; }
  .final-pts { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--primary); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<!-- Header -->
<div class="header-bar">
  <img src="Paraco_Logo.png" alt="Paraco" style="height:42px;width:auto">
  <div class="q-progress" id="headerProgress" style="display:none">
    <span class="progress-label">Progress</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="q-num" id="headerQNum">1 / 10</div>
  </div>
</div>

<!-- Timer (shown during question) -->
<div class="timer-container" id="timerContainer" style="display:none">
  <div class="timer-wrap-pos">
    <svg class="timer-svg" width="90" height="90" viewBox="0 0 90 90">
      <circle class="bg-c" cx="45" cy="45" r="38"/>
      <circle class="fg-c" id="stageArc" cx="45" cy="45" r="38"
        stroke-dasharray="238.8" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-center" id="stageTimerNum">20</div>
  </div>
</div>

<!-- Answer count (shown during question) -->
<div class="answer-count-bar" id="answerCountBar" style="display:none">
  <div>
    <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Answered</div>
    <div class="ans-count-num" id="ansCountNum">0 / 0</div>
  </div>
  <div class="ans-dots" id="ansDots"></div>
</div>

<!-- STAGE: Lobby -->
<div class="stage active" id="stageLobby">
  <img src="Paraco_Logo.png" alt="Paraco" style="height:70px;width:auto;margin-bottom:1rem">
  <div class="lobby-title">PARACO</div>
  <div class="lobby-sub">CEA Trivia Challenge</div>
  <div class="lobby-instruction">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Open join.html</div>
    </div>
    <div class="divider"></div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Enter your name</div>
    </div>
    <div class="divider"></div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Wait for host</div>
    </div>
  </div>
  <div class="player-bubbles" id="lobbyBubbles">
    <span style="color:var(--muted);font-size:0.9rem">Waiting for players to join...</span>
  </div>
</div>

<!-- STAGE: Question -->
<div class="stage" id="stageQuestion">
  <div class="cat-pill" id="stageCatPill"></div>
  <div class="question-text" id="stageQText"></div>
  <div class="choices-stage" id="stageChoices"></div>
</div>

<!-- STAGE: Reveal -->
<div class="stage" id="stageReveal">
  <div class="reveal-correct-label">Correct Answer</div>
  <div class="reveal-answer" id="revealAnswer"></div>
  <div class="scorers-wrap">
    <div class="scorers-label" id="scorersLabel"></div>
    <div class="scorers-list" id="scorersList"></div>
  </div>
</div>

<!-- STAGE: Scores -->
<div class="stage" id="stageScores">
  <div class="scores-title">SCOREBOARD</div>
  <div class="scores-list" id="stageScoresList"></div>
</div>

<!-- STAGE: End -->
<div class="stage" id="stageEnd">
  <div class="end-trophy">🏆</div>
  <div class="end-title">GAME OVER!</div>
  <div class="final-scores" id="finalScores"></div>
</div>

<script src="questions.js"></script>
<script src="state.js"></script>
<script>
  GameState.init();

  let stageTimer = null;
  let stageTimerEnd = null;

  function showStage(id) {
    document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  function getQ(state) {
    if (!state.currentQuestion) return null;
    const cat = TRIVIA_DATA.categories.find(c => c.id === state.currentQuestion.categoryId);
    if (!cat) return null;
    const q = cat.questions.find(q => q.id === state.currentQuestion.questionId);
    return q ? { q, cat } : null;
  }

  function startStageTimer(timerStart, limit) {
    clearStageTimer();
    stageTimerEnd = timerStart + limit * 1000;
    document.getElementById('timerContainer').style.display = 'flex';
    const circ = 2 * Math.PI * 38;
    function tick() {
      const remaining = Math.max(0, Math.ceil((stageTimerEnd - Date.now()) / 1000));
      document.getElementById('stageTimerNum').textContent = remaining;
      const pct = remaining / limit;
      const arc = document.getElementById('stageArc');
      arc.style.strokeDashoffset = circ * (1 - pct);
      arc.style.stroke = remaining <= 5 ? '#ef4444' : (remaining <= 10 ? '#5BA4CF' : 'var(--primary)');
    }
    tick();
    stageTimer = setInterval(tick, 250);
  }

  function clearStageTimer() {
    if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
    document.getElementById('timerContainer').style.display = 'none';
  }

  function renderState(state) {
    const phase = state.phase || 'lobby';
    const queue = state.questionQueue || [];
    const idx = state.currentIndex ?? -1;
    const players = state.players || {};
    const playerNames = Object.keys(players);

    // Header progress
    if (phase === 'question' || phase === 'reveal') {
      document.getElementById('headerProgress').style.display = 'flex';
      document.getElementById('headerQNum').textContent = `${idx + 1} / ${queue.length}`;
      document.getElementById('progressBar').style.width = `${queue.length ? ((idx + 1) / queue.length * 100) : 0}%`;
    } else {
      document.getElementById('headerProgress').style.display = 'none';
    }

    if (phase === 'lobby') {
      showStage('stageLobby');
      clearStageTimer();
      document.getElementById('answerCountBar').style.display = 'none';
      const bubbles = document.getElementById('lobbyBubbles');
      if (playerNames.length === 0) {
        bubbles.innerHTML = '<span style="color:var(--muted);font-size:0.9rem">Waiting for players to join...</span>';
      } else {
        bubbles.innerHTML = playerNames.map(n => `
          <div class="player-bubble"><span class="dot"></span>${n}</div>
        `).join('');
      }

    } else if (phase === 'question') {
      showStage('stageQuestion');
      const obj = getQ(state);
      if (obj) {
        document.getElementById('stageCatPill').textContent = `${obj.cat.emoji} ${obj.cat.name}`;
        document.getElementById('stageQText').textContent = obj.q.question;
        const labels = ['A','B','C','D'];
        document.getElementById('stageChoices').innerHTML = obj.q.choices.map((ch, i) => `
          <div class="choice-stage">
            <div class="choice-key">${labels[i] || i+1}</div>
            <span>${ch}</span>
          </div>
        `).join('');
      }
      // Timer
      if (state.timerStart) startStageTimer(state.timerStart, state.timeLimit || 20);
      // Answer count
      const answered = Object.keys(state.answers || {}).length;
      const total = playerNames.length;
      document.getElementById('answerCountBar').style.display = 'flex';
      document.getElementById('ansCountNum').textContent = `${answered} / ${total}`;
      document.getElementById('ansDots').innerHTML = playerNames.map(n => {
        const hasAns = (state.answers || {})[n] !== undefined;
        return `<div class="ans-dot ${hasAns ? 'in' : ''}"></div>`;
      }).join('');

    } else if (phase === 'reveal') {
      showStage('stageReveal');
      clearStageTimer();
      document.getElementById('answerCountBar').style.display = 'none';
      const obj = getQ(state);
      if (obj) {
        document.getElementById('revealAnswer').textContent = obj.q.choices[obj.q.answer];
        // Who got it right?
        const answers = state.answers || {};
        const correct = playerNames.filter(n => answers[n] === obj.q.answer);
        if (correct.length > 0) {
          document.getElementById('scorersLabel').textContent = `${correct.length} player${correct.length > 1 ? 's' : ''} got it right`;
          document.getElementById('scorersList').innerHTML = correct.map(n => `<div class="scorer-pill">✓ ${n}</div>`).join('');
        } else {
          document.getElementById('scorersLabel').textContent = 'Nobody got it right this round';
          document.getElementById('scorersList').innerHTML = '';
        }
      }

    } else if (phase === 'scores') {
      showStage('stageScores');
      clearStageTimer();
      document.getElementById('answerCountBar').style.display = 'none';
      const sorted = playerNames.slice().sort((a, b) => ((players[b]||{}).score||0) - ((players[a]||{}).score||0));
      document.getElementById('stageScoresList').innerHTML = sorted.map((name, i) => `
        <div class="score-row-stage" style="animation-delay:${i * 0.08}s">
          <div class="rank-num ${i === 0 ? 'gold-rank' : ''}">${i + 1}</div>
          <div class="rank-name">${name}</div>
          <div class="rank-pts">${(players[name]||{}).score || 0}</div>
        </div>
      `).join('');

    } else if (phase === 'ended') {
      showStage('stageEnd');
      clearStageTimer();
      document.getElementById('answerCountBar').style.display = 'none';
      const sorted = playerNames.slice().sort((a, b) => ((players[b]||{}).score||0) - ((players[a]||{}).score||0));
      document.getElementById('finalScores').innerHTML = sorted.map((name, i) => `
        <div class="final-row">
          <div class="final-rank ${i === 0 ? 'top' : ''}">${i + 1}</div>
          <div class="final-name">${name}</div>
          <div class="final-pts">${(players[name]||{}).score || 0}</div>
        </div>
      `).join('');
    }
  }

  GameState.onChange(renderState);
  renderState(GameState.get());
</script>
</body>
</html>
